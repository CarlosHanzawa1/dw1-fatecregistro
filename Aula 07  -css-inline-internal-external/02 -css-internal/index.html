<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCS internal</title>
    <!-- Aqui vai o CSS Internal -->
     <style>
        p{
            color: #f87575;
            font-size: 19px;
        }
        .destaque{
            background-color: #125096;
            color: #FFFFFF;
            padding: 10px;
            border-left: 10px solid orange;
        }
        #principal{
            border: 2px solid orange;
            padding: 20px;
            margin: 20px;
        }
        #tituloSecao{
            color: brown;
        }
     </style>
</head>
<body>
    <h1>Demonstração de CSS internal</h1>
    <p>Este parágrafo é estilizado 
        <br> através do CSS internal, definido no head.
    </p>
    <p class="destaque">
        Este parágrafo possui uma classe (.) "destaque" e recebe estilos especificos. 
    </p>
    <section id="principal">
        <h2 id="tituloSecao">Seção principal</h2>
        <p style="color: blue;">Esta seção possui o ID (#) principal é estilizada de forma única</p>
    </section>
    
</body>
</html>
