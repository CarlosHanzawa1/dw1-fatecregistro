<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>
    <h1>Formuários no HTML5</h1>
    <form action="#" method="POST">
      <!-- input de text -->
      <label for="name">Nome:</label><br />
      <input
        name="nome"
        type="text"
        id="name"
        placeholder="Insira seu nome "
        required
      /><br />
      <!-- input de e-mail -->
      <label for="email">E-mail</label><br />
      <input
        name="email"
        type="email"
        id="email"
        placeholder="Insira seu E-mail"
      /><br />
      <!-- input de senha -->
      <label for="senha">Senha:</label><br />
      <input
        name="senha"
        type="password"
        id="senha"
        placeholder="Insira sua senha"
      /><br />
      <br /><br />
      <!-- Botão de submeter o formulário -->
      <input type="submit" value="Cadastrar" />
      <!-- Botão de limpar o formulário -->
      <input type="reset" value="Limpar" />
    </form>
    <br /><br />
    <hr />
    <h4>Outros inputs</h4>
    <form>
      <!-- input numeros -->
      <label>Quantidade:</label><br />
      <input type="number" min="0" max="10" /><br />
      <!-- input de data -->
      <label>Data:</label><br />
      <input type="date" /><br />
      <!-- input de arquivos -->
      <label>Arquivos:</label><br />
      <input type="file" /><br />
      <!-- campo de texto longo -->
      <label>Comentários:</label><br />
      <textarea rows="4" cols="30"></textarea>
      <!-- campo invisível -->
      <input type="hidden" name="idProduto" value="9" /><br />
      <!-- caixa de seleção -->
      <label>Cursos:</label><br />
      <select name="cursos">
        <option value="1">Programação</option>
        <option value="2">Design Gráfico</option>
        <option value="3">Música</option>
        <option value="4">Enfermagem</option>
      </select>
    </form>
    <br /><br />
    <hr />
    <h2>Exemplo de formulário completo:</h2>
    <!-- formulário completo -->
    <h4>Cadastro do usuário</h4>
    <form action="#" method="POST">
      <fieldset>
        <legend>Dados Pessoais:</legend>
        <label for="name">Nome:</label>
        <input
          type="text"
          placeholder="Insira seu nome"
          id="name"
          name="name"
        /><br />
        <label for="nascimento">Data de nascimento:</label>
        <input type="date" /><br />
        <label for="sexo">Sexo:</label>
        <!-- radio buttons -->
        <input type="radio" name="sexo" required />Masculino
        <input type="radio" name="sexo" />Femenino
        <input type="radio" name="sexo" />Prefiro não informar
      </fieldset>
      <br />
      <fieldset>
        <legend>Dados de Endereços:</legend>
        <label for="rua">Rua:</label>
        <input type="text" />
        <label for="numero">Número</label>
        <input type="number" />
      </fieldset>
      <br />
      <fieldset>
        <legend>Dados do produto:</legend>
        <label>Cor do produto:</label>
        <input type="color" /><br />
        <input type="checkbox" />Li e aceitos os termos de uso <br /><br>
        <input type="text" placeholder="Este campo está desativado " disabled><br><br>
        <input type="submit" value="Cadastrar" />
        <input type="submit" value="Limpar" />
      </fieldset>
    </form>
  </body>
</html>
