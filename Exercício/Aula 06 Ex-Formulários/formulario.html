<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Cadastro de Aluno - DSM</h1>
    <P>Formulário para cadastro de Alunos do DSM1</P>
    <form action="#" method="post">
       <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo</label>
            <input type="text" nome="nome" id="nome" required><br>

            <label for="email">E-mail</label>
            <input type="email" nome="email" id="email" required><br>

            <label for="data">Data de Nascimento</label>
            <input type="date" id="data" required>
       </fieldset>
       <fieldset>
        <legend for="cursos">Dados Acadêmicos</legend>
        <label>Cursos:</label>
        <select name="cursos">
            <option value="1">DSM</option>
            <option value="2">ADS</option>
            <option value="3">ES</option>
        </select><br>
        <label for="periodo">Período</label>
        <input type="radio" name="periodo">Manhã
        <input type="radio" name="periodo">Noite <br>

        <label>Observações</label><br>
        <textarea rows="4" cols="30"></textarea>
        <br><br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>

       </fieldset>
    </form>
</body>
</html>
